name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v190.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v190.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v19.0
        name: "V19.0 YOLO+策略引擎"
        body: "V19.0: 🎉 YOLO识别+向听数策略引擎+横屏宽面板！1) 使用/api/recognize YOLO API自动识别 2) 内置向听数计算器推荐弃牌 3) 横屏面板从12%加宽到28%看得清策略 4) 修复ONNX输出解析兼容性"
        files: app/build/outputs/apk/debug/mjhelper_v190.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
