name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v200.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v200.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v20.0
        name: "V20.0 可调窗口+模型加载修复"
        body: "V20.0: 🔧 1) 左边缘拖拽调整面板宽度 2) ONNX模型先CPU再NNAPI分步加载 3) 模型加载失败显示具体错误 4) 一键重试加载模型 5) 自动重试5次"
        files: app/build/outputs/apk/debug/mjhelper_v200.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
