name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v220.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v220.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v22.0
        name: "V22.0 修复YOLO识别0检测的致命BUG"
        body: "V22.0: 🐛★关键修复★ ONNX模型输出bbox是归一化坐标(0-1),之前代码当成640像素空间坐标处理,导致所有检测被过滤为0! 修复:cx/cy/w/h先乘640转像素再反算原始坐标. Python实测验证:修复后0→206个检测,NMS后33个,手牌9张"
        files: app/build/outputs/apk/debug/mjhelper_v220.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
