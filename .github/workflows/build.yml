name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v225.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v225.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v22.5
        name: "V22.5 禁用NNAPI+修复版本号+增强debug"
        body: "V22.5: ★禁用NNAPI(CPU推理更稳定,NNAPI可能导致检测数暴跌) ★修复FloatingService版本号v22.1→v22.5 ★移除HTML重复标题栏 ★修复旋转后cropRight计算 ★增加详细debug(conf_pass/coord_pass/size_pass/双格式对比) ★动态更新原生标题栏显示手牌数"
        files: app/build/outputs/apk/debug/mjhelper_v225.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
