name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v224.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v224.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v22.4
        name: "V22.4 修复JSON构造BUG"
        body: "V22.4: 修复HttpServerService中6处JSON构造BUG - 全部改用JSONObject/JSONArray替代手动字符串拼接。旧BUG: Kotlin List.toString()输出[2m,4m]无引号→非法JSON→前端解析崩溃。修复后: 所有JSON使用org.json库构造，自动转义特殊字符，彻底消灭手动拼接"
        files: app/build/outputs/apk/debug/mjhelper_v224.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
