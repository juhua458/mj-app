name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v221.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v221.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v22.1
        name: "V22.1 修复竖屏截屏旋转+归一化坐标"
        body: "V22.1: 🐛★关键修复★ MediaProjection截屏是竖屏(832x1758),游戏内容旋转90°导致手牌过滤为0! 修复:检测竖屏截图自动顺时针旋转90°变横屏再处理. 归一化坐标BUG同步修复(*640)"
        files: app/build/outputs/apk/debug/mjhelper_v221.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
