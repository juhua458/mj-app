name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v210.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v210.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v21.0
        name: "V21.0 Letterbox预处理+截屏裁剪+面板高度可调"
        body: "V21.0: 🔧 1) Letterbox预处理(保持宽高比,与YOLO训练一致) 2) 截屏裁剪(去掉helper面板区域) 3) FloatBuffer解析ONNX输出 4) 置信度阈值0.15 5) 面板高度默认60%(底部留空给碰杠胡) 6) 底部拖拽条调高度 7) 调试信息增强"
        files: app/build/outputs/apk/debug/mjhelper_v210.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
