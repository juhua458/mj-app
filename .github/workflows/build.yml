name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v180.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v180.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v18.0
        name: "V18.0 YOLO AI识别"
        body: "V18.0: 🎉 重大升级！集成YOLO11n深度学习模型，ONNX Runtime推理引擎，35类麻将牌自动识别，告别像素分析！"
        files: app/build/outputs/apk/debug/mjhelper_v180.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
