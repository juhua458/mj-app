name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v178.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v178.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v17.8
        name: "V17.8 花色识别优化"
        body: "V17.8: 花色识别重写(底部区域分析+白色比例判万+青/绿分离)+绿色桌面最小面积检测防误识别"
        files: app/build/outputs/apk/debug/mjhelper_v178.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
