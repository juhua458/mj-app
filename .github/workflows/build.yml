name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      
    - name: Build Debug APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug
        
    - name: Rename APK
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/mjhelper_v222.apk
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/mjhelper_v222.apk
    
    - name: Upload to Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v22.2
        name: "V22.2 修复ONNX输出格式选择BUG"
        body: "V22.2: 修复ONNX输出格式选择BUG - 用tensor shape确定格式不再盲猜选多。旧BUG: [39,8400]数据被[8400,39]错读→更多假阳性被选中→垃圾bbox→0手牌"
        files: app/build/outputs/apk/debug/mjhelper_v222.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
