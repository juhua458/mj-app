<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🀄 捉鸡麻将提示器 v17.4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--bg2:#131825;--card:#1c2333;--text:#e8edf5;--text2:#8b95a8;--red:#e54545;--green:#2ebd5e;--blue:#4a8eff;--gold:#f0a030}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow-y:auto;-webkit-overflow-scrolling:touch}
.debug{padding:2px 4px;background:#111;font-size:.45rem;color:#0f0;max-height:50px;overflow-y:auto;font-family:monospace;flex-shrink:0;white-space:pre-wrap;word-break:break-all;border-bottom:2px solid #333}
.top-bar{padding:3px 6px;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.top-bar h1{font-size:.7rem;font-weight:700}
.status-bar{display:flex;gap:3px;padding:3px 8px;background:var(--bg2);flex-wrap:wrap;flex-shrink:0}
.chip{padding:1px 5px;border-radius:8px;font-size:.55rem;font-weight:600}
.chip.early{background:var(--green);color:#000}.chip.cnt{background:var(--purple,#9b5dff);color:#fff}
.auto-section{padding:2px 6px;background:var(--bg2);flex-shrink:0}
.auto-status{display:flex;align-items:center;gap:4px;font-size:.6rem}
.auto-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.auto-dot.on{background:var(--green);animation:blink 1s infinite}
.auto-dot.off{background:var(--red)}.auto-dot.try{background:var(--gold);animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.auto-btns{display:flex;gap:2px;margin-top:2px}
.abtn{flex:1;padding:4px;border:none;border-radius:4px;font-size:.6rem;font-weight:700;cursor:pointer;color:#fff}
.abtn.start{background:linear-gradient(135deg,var(--green),#1a9c4a)}
.abtn.stop{background:linear-gradient(135deg,var(--red),#c03030)}
.abtn.snap{background:linear-gradient(135deg,var(--blue),#2a6ed4)}
.preview{width:100%;height:28px;background:#000;border-radius:3px;overflow:hidden;margin-top:3px}
.preview canvas{width:100%;height:100%;object-fit:contain;display:none}
.preview .no-src{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:.55rem}
.ocr-row{display:flex;gap:2px;flex-wrap:wrap;padding:3px 8px;background:var(--bg2);min-height:20px;flex-shrink:0}
.ocr-chip{padding:1px 4px;border-radius:2px;font-size:.55rem;font-weight:700;color:#fff}
.ocr-chip.wan{background:var(--red)}.ocr-chip.tiao{background:var(--green)}.ocr-chip.tong{background:var(--blue)}.ocr-chip.unk{background:#555}
.hand-area{padding:2px 6px;background:var(--bg2);flex-shrink:0}
.hand-row{display:flex;gap:1px;flex-wrap:wrap;min-height:24px;padding:1px;background:var(--bg);border-radius:4px}
.tile{width:20px;height:26px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile.wan{background:linear-gradient(180deg,#fff,#fde8e8)}.tile.tiao{background:linear-gradient(180deg,#fff,#e8fde8)}.tile.tong{background:linear-gradient(180deg,#fff,#e8e8fd)}
.tile .tn{font-size:9px;font-weight:800;line-height:1}.tile.wan .tn{color:var(--red)}.tile.tiao .tn{color:var(--green)}.tile.tong .tn{color:var(--blue)}
.tile .ts{font-size:5px;font-weight:600;line-height:1}.tile.wan .ts{color:var(--red)}.tile.tiao .ts{color:var(--green)}.tile.tong .ts{color:var(--blue)}
.miss-bar{padding:2px 8px;font-size:.55rem;font-weight:700;flex-shrink:0}
.miss-bar.ok{background:rgba(46,189,94,.1);color:var(--green)}.miss-bar.warn{background:rgba(240,160,48,.1);color:var(--gold)}
.discard-section{padding:2px 6px;background:var(--bg2);flex-shrink:0}
.discard-title{font-size:.55rem;font-weight:700;color:var(--text2);margin-bottom:2px;display:flex;justify-content:space-between}
.discard-pool{display:flex;gap:1px;flex-wrap:wrap;min-height:16px;padding:2px;background:var(--bg);border-radius:3px}
.discard-tile{padding:1px 3px;border-radius:2px;font-size:.5rem;font-weight:700}
.discard-tile.wan{background:rgba(229,69,69,.2);color:var(--red)}.discard-tile.tiao{background:rgba(46,189,94,.2);color:var(--green)}.discard-tile.tong{background:rgba(74,142,255,.2);color:var(--blue)}
.discard-add{display:flex;gap:2px;margin-top:3px}
.discard-add select{flex:1;padding:2px;border-radius:3px;background:var(--card);color:var(--text);border:none;font-size:.55rem}
.discard-add button{padding:2px 8px;border-radius:3px;background:var(--gold);color:#000;border:none;font-size:.55rem;font-weight:700}
.strategy{padding:2px 6px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.best-card{background:var(--card);border-radius:6px;padding:6px;border:1px solid rgba(240,160,48,.3)}
.best-label{font-size:.55rem;color:var(--gold);margin-bottom:2px}
.best-tile{font-size:.8rem;font-weight:800;text-align:center}
</style>
</head>
<body>
<div class="app">
<div class="top-bar" style="padding:1px 4px"><h1 style="font-size:.5rem;margin:0">🀄 v17.4</h1></div>
<div class="debug" id="debugPanel"></div>
<div class="status-bar"><span class="chip early">早局</span><span class="chip cnt">牌:0</span></div>
<div class="auto-section">
<div class="auto-status"><div class="auto-dot off" id="autoDot"></div><span id="autoText">未启动</span></div>
<div class="auto-btns">
<button id="btnStart" class="abtn start" onclick="startAuto()">▶ 启动</button>
<button id="btnStop" class="abtn stop" onclick="stopAuto()" style="display:none">⏹ 停止</button>
<button class="abtn snap" onclick="snapOnce()">📸 单次</button>
</div>
<div class="preview"><div class="no-src" id="noSrc">无截图</div><canvas id="cvs"></canvas></div>
</div>
<div class="ocr-row" id="ocrRow"></div>
<div class="hand-area"><div class="hand-row" id="handRow"></div></div>
<div class="miss-bar ok" id="missBar">缺一门: 无</div>
<div class="discard-section">
<div class="discard-title">弃牌池 <span id="clearDiscard" style="color:var(--red);cursor:pointer" onclick="clearDiscards()">清空</span></div>
<div class="discard-pool" id="discardPool"></div>
<div class="discard-add"><select id="addTileSel"></select><button onclick="addDiscard()">+添加</button></div>
</div>
<div class="strategy"><div class="best-card"><div class="best-label">推荐弃牌</div><div class="best-tile" id="bestTile">-</div></div></div>
</div>

  if(names.length===0){templatesReady=true;log('⚠️ 无模板');return}
  for(var i=0;i<names.length;i++){(function(name){
    var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);templateCanvases[name]=c;loaded++;if(loaded>=names.length){templatesReady=true;log('✅ '+names.length+'个模板就绪')}};img.onerror=function(){loaded++;if(loaded>=names.length){templatesReady=true}};
    img.src=TILE_TEMPLATES[name];
  })(names[i])}
}

function loadLearnedTemplates(){try{var s=localStorage.getItem(LEARNED_KEY);if(s){learnedTemplates=JSON.parse(s);for(var k in learnedTemplates)if(!TILE_TEMPLATES[k])TILE_TEMPLATES[k]=learnedTemplates[k];log('📚 '+Object.keys(learnedTemplates).length+'个自学习模板')}}catch(e){}}

function saveLearnedTemplate(n,u){if(TILE_TEMPLATES[n])return;learnedTemplates[n]=u;TILE_TEMPLATES[n]=u;var img=new Image();img.onload=function(){var c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);templateCanvases[n]=c};img.src=u;try{localStorage.setItem(LEARNED_KEY,JSON.stringify(learnedTemplates))}catch(e){}log('✅ 学习: '+n)}

function computeNCC(imgData1,templateCanvas){
  var w1=imgData1.width,h1=imgData1.height,d1=imgData1.data;
  var tw=templateCanvas.width,th=templateCanvas.height;
  var resizedCanvas=templateCanvas;
  if(tw!=w1||th!=h1){
    resizedCanvas=document.createElement('canvas');resizedCanvas.width=w1;resizedCanvas.height=h1;
    resizedCanvas.getContext('2d').drawImage(templateCanvas,0,0,tw,th,0,0,w1,h1);
  }
  var ctx2=resizedCanvas.getContext('2d');var imgData2=ctx2.getImageData(0,0,w1,h1);
  var d2=imgData2.data;
  var sum1=0,sum2=0,sum12=0,sum1sq=0,sum2sq=0;
  for(var i=0;i<w1*h1*4;i+=4){var v1=(d1[i]+d1[i+1]+d1[i+2])/3;var v2=(d2[i]+d2[i+1]+d2[i+2])/3;sum1+=v1;sum2+=v2;sum12+=v1*v2;sum1sq+=v1*v1;sum2sq+=v2*v2}
  var denom=Math.sqrt(Math.max(0,sum1sq)*Math.max(0,sum2sq));
  if(denom===0)return -1;return sum12/denom;
}

function guessSuit(imgData){
  var d=imgData.data,len=d.length;var sumR=0,sumG=0,sumB=0,bluPct=0;
  for(var i=0;i<len;i+=4){sumR+=d[i];sumG+=d[i+1];sumB+=d[i+2];if(d[i+2]>d[i]&&d[i+2]>d[i+1])bluPct++}
  var n=len/4;var avgR=sumR/n,avgG=sumG/n,avgB=sumB/n;bluPct=bluPct/n;
  if(avgG>107&&avgG>avgB+25)return 'tiao';
  if(avgR>avgG+20&&avgR>avgB+20)return 'wan';
  if(bluPct>0.15)return 'tong';
  return null;
}

function isGreenPixel(r,g,b){return r<60&&g>50&&b<130&&g>r+8&&g>b}

function findTileBoundaries(imgData,w,h){
  var d=imgData.data,step=4;
  var minX=w,maxX=0;
  for(var x=0;x<w;x+=2){for(var y=0;y<h;y+=2){var i=(y*w+x)*4;if(d[i]>155&&d[i+1]>155&&d[i+2]>155){if(x<minX)minX=x;if(x>maxX)maxX=x}}}
  if(maxX<=minX)return [];
  var tileSpan=maxX-minX;
  var tileW=Math.floor(tileSpan/14);
  var tiles=[];
  for(var j=0;j<14;j++){tiles.push({x:minX+j*tileW,y:0,w:tileW,h:h})}
  return tiles;
}

function analyzeFrame(canvas){
  if(!templatesReady){log('⏳ 模板未加载');return[]}
  var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;
  var isLandscape=w>h;
  log('📐 '+(isLandscape?'横屏':'竖屏')+' '+w+'x'+h);
  var imgData=ctx.getImageData(0,0,w,h),d=imgData.data;
  var step=Math.max(4,Math.floor((isLandscape?h:w)/200));
  
  // Scan rows for green percentage
  var greenProfile=[];
  for(var y=0;y<h;y+=step){var gCnt=0,total=0;for(var x=0;x<w;x+=step){total++;var i=(y*w+x)*4;if(isGreenPixel(d[i],d[i+1],d[i+2]))gCnt++}greenProfile.push({y:y,ratio:gCnt/total})}
  
  // Find the main green zone (table)
  var greenStart=-1,greenEnd=-1,maxGreenLen=0;
  var curStart=-1;
  for(var i=0;i<greenProfile.length;i++){
    if(greenProfile[i].ratio>0.4){if(curStart<0)curStart=i}
    else{if(curStart>=0){var len=i-curStart;if(len>maxGreenLen){maxGreenLen=len;greenStart=greenProfile[curStart].y;greenEnd=greenProfile[i-1].y}curStart=-1}}
  }
  if(curStart>=0){var len=greenProfile.length-curStart;if(len>maxGreenLen){greenStart=greenProfile[curStart].y;greenEnd=greenProfile[greenProfile.length-1].y}}
  
  if(greenStart<0){log('❌ 未找到绿色桌面区域');return[]}
  log('🟢 桌面: y='+greenStart+'-'+greenEnd+' ('+(greenEnd-greenStart)+'px)');
  
  // Find hand tiles: scan FROM BOTTOM UPWARD within green zone
  var handTop=-1,handBottom=-1;
  // In landscape, hand cards are in the center 60% of width; in portrait, 80%
  var midStart=Math.floor(w*(isLandscape?0.05:0.1)),midEnd=Math.floor(w*(isLandscape?0.65:0.9)),midW=midEnd-midStart;
  for(var i=greenProfile.length-1;i>=0;i--){
    var y=greenProfile[i].y;
    if(y>greenEnd+5||y<greenStart-5)continue;
    var midWhite=0;for(var x=midStart;x<midEnd;x+=step){var idx=(y*w+x)*4;if(d[idx]>155&&d[idx+1]>155&&d[idx+2]>155)midWhite++}
    var midWhiteRatio=midWhite/(midW/step);
    if(midWhiteRatio>0.2){
      if(handBottom<0)handBottom=y+step;
      handTop=y;
    }else if(handBottom>0){break}
  }
  if(handTop<0){
    // Fallback: scan bottom portion of screen directly (full-screen game mode)
    var fallbackTop=Math.floor(h*(isLandscape?0.75:0.85)),fallbackBot=h;
    for(var y=fallbackTop;y<fallbackBot;y+=step){
      var midWhite=0;for(var x=midStart;x<midEnd;x+=step){var idx=(y*w+x)*4;if(d[idx]>155&&d[idx+1]>155&&d[idx+2]>155)midWhite++}
      var midWhiteRatio=midWhite/(midW/step);
      if(midWhiteRatio>0.15){
        if(handBottom<0)handBottom=y+step;
        handTop=y;
      }else if(handBottom>0){break}
    }
  }
  if(handTop<0){log('❌ 未找到手牌白色区域');return[]}
  if(handTop>handBottom){var tmp=handTop;handTop=handBottom;handBottom=tmp}
  
  var handHeight=handBottom-handTop;
  if(handHeight<20){log('⚠️ 手牌区域太小:'+handHeight+'px');return[]}
  log('🎯 手牌: y='+handTop+'-'+handBottom+' ('+handHeight+'px)');
  
  var handImg=ctx.getImageData(0,handTop,w,handHeight);
  var tilePos=findTileBoundaries(handImg,w,handHeight);
  log('🀄 分割:'+tilePos.length+'块');
  
  var results=[];
  for(var p=0;p<tilePos.length;p++){
    var pos=tilePos[p];var tileData=ctx.getImageData(pos.x,handTop+pos.y,pos.w,pos.h);
    var bestMatch=null,bestScore=0;
    for(var name in templateCanvases){var score=computeNCC(tileData,templateCanvases[name]);if(score>bestScore){bestScore=score;bestMatch=name}}
    if(bestScore>=0.75){results.push({name:bestMatch,score:bestScore,method:'TM'})}
    else{var suit=guessSuit(tileData);if(suit)results.push({name:suit,score:bestScore,method:'PX'})}
  }
  log('🔍 识别:'+results.length+'张('+results.filter(function(r){return r.method==='TM'}).length+'TM)');
  return results;
}

function tileNameToIdx(n){var nums=['一','二','三','四','五','六','七','八','九'];var suit=n.slice(-3);var num=n.slice(0,-3);var numIdx=nums.indexOf(num);if(numIdx<0)return -1;var suitIdx=['wan','tiao','tong'].indexOf(suit);if(suitIdx<0)return -1;return suitIdx*9+numIdx}

function applyOcrResult(res){
  hand=new Array(27).fill(0);for(var i=0;i<res.length;i++){var idx=tileNameToIdx(res[i].name);if(idx>=0)hand[idx]++}
  handSize=res.length;updateHandUI();updateOcrRow(res);
  var sum=0;for(var i=0;i<27;i++)sum+=hand[i];
}

function updateHandUI(){var row=document.getElementById('handRow');row.innerHTML='';for(var i=0;i<27;i++){for(var c=0;c<hand[i];c++){var d=document.createElement('div');d.className='tile '+getSuit(i);d.innerHTML='<span class="tn">'+TN[i%9]+'</span><span class="ts">'+getSuitName(i)+'</span>';row.appendChild(d)}}document.querySelector('.chip.cnt').textContent='牌:'+handSize;var missing=findMissing();document.getElementById('missBar').textContent='缺一门: '+missing;document.getElementById('missBar').className='miss-bar '+(!missing||missing==='无'?'ok':'warn')}

function updateOcrRow(res){var row=document.getElementById('ocrRow');row.innerHTML='';var nums=['一','二','三','四','五','六','七','八','九'];var suitMap={wan:'万',tiao:'条',tong:'筒'};for(var i=0;i<res.length;i++){var r=res[i];var chip=document.createElement('span');var suit=r.name.slice(-3);var num=r.name.slice(0,-3);var numIdx=nums.indexOf(num);chip.className='ocr-chip '+(suitMap[suit]?suit:'unk');chip.textContent=(numIdx>=0&&suitMap[suit])?nums[numIdx]+suitMap[suit]:r.name;row.appendChild(chip)}}

function getSuit(i){return i<9?'wan':i<18?'tiao':'tong'}
function getSuitName(i){return i<9?'万':i<18?'条':'筒'}
function findMissing(){var hasW=false,hasT=false,hasO=false;for(var i=0;i<9;i++)if(hand[i]>0)hasW=true;for(var i=9;i<18;i++)if(hand[i]>0)hasT=true;for(var i=18;i<27;i++)if(hand[i]>0)hasO=true;var m=[];if(!hasW)m.push('万');if(!hasT)m.push('条');if(!hasO)m.push('筒');return m.join('')||'无'}
function addDiscard(){var sel=document.getElementById('addTileSel').value;var idx=tileNameToIdx(sel);if(idx>=0){discards[idx]++;updateDiscardUI()}}
function clearDiscards(){discards=new Array(27).fill(0);updateDiscardUI()}
function updateDiscardUI(){var pool=document.getElementById('discardPool');pool.innerHTML='';for(var i=0;i<27;i++){for(var c=0;c<discards[i];c++){var d=document.createElement('div');d.className='discard-tile '+getSuit(i);d.textContent=TN[i%9];pool.appendChild(d)}}}
function populateAddSelect(){var sel=document.getElementById('addTileSel');var nums=['一','二','三','四','五','六','七','八','九'];var suits=[['wan','万'],['tiao','条'],['tong','筒']];for(var s of suits){for(var n of nums){var opt=document.createElement('option');opt.value=n+s[0];opt.textContent=n+s[1];sel.appendChild(opt)}}}

async function startAuto(){isAuto=true;document.getElementById('btnStart').style.display='none';document.getElementById('btnStop').style.display='';document.getElementById('autoDot').className='auto-dot try';document.getElementById('autoText').textContent='连接中...';log('▶ v17.4 启动');tryAutoConnect()}
async function tryAutoConnect(){if(!isAuto)return;try{var r=await fetch(APP_URL+'/api/status',{cache:'no-store',signal:AbortSignal.timeout(3000)});if(r.ok){var i=await r.json();if(i.running){document.getElementById('autoDot').className='auto-dot on';document.getElementById('autoText').textContent='✅ 已连接';autoLoop();return}}}catch(e){log('❌ '+e.message)}document.getElementById('autoDot').className='auto-dot off';document.getElementById('autoText').textContent='❌ 3秒后重试';autoTimer=setTimeout(tryAutoConnect,3000)}
async function autoLoop(){if(!isAuto)return;try{var r=await fetch(APP_URL+'/api/screenshot?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(3000)});if(r.ok){var b=await r.blob();if(b.size<1000){log('⚠️ 截图太小');autoTimer=setTimeout(autoLoop,1500);return}var img=new Image();img.onload=function(){var c=document.getElementById('cvs');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);c.style.display='block';document.getElementById('noSrc').style.display='none';log('📸 '+img.width+'x'+img.height);var res=analyzeFrame(c);if(res.length>0){lastGoodResult=res;applyOcrResult(res)}else if(lastGoodResult){log('⚠️ 沿用上次')}};img.onerror=function(){log('❌ 加载失败')};img.src=URL.createObjectURL(b)}}catch(e){log('❌ '+e.message)}autoTimer=setTimeout(autoLoop,1200)}
function stopAuto(){isAuto=false;if(autoTimer){clearTimeout(autoTimer);autoTimer=null}document.getElementById('btnStart').style.display='';document.getElementById('btnStop').style.display='none';document.getElementById('autoDot').className='auto-dot off';document.getElementById('autoText').textContent='已停止'}
function snapOnce(){if(!isAuto)startAuto()}

window.onload=function(){loadLearnedTemplates();loadAllTemplates();populateAddSelect();log('🀄 v17.4 就绪 模板:'+Object.keys(TILE_TEMPLATES).length+'个')};
</script>
