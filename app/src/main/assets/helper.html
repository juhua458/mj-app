<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🀄 捉鸡麻将提示器 v22.4</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--bg2:#131825;--card:#1c2333;--text:#e8edf5;--text2:#8b95a8;--red:#e54545;--green:#2ebd5e;--blue:#4a8eff;--gold:#f0a030;--purple:#9b5dff}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow-y:auto;-webkit-overflow-scrolling:touch}
.top-bar{padding:4px 8px;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.top-bar h1{font-size:.75rem;font-weight:700}
.status-row{display:flex;gap:4px;padding:4px 8px;background:var(--bg2);align-items:center;flex-shrink:0;flex-wrap:wrap}
.status-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.status-dot.on{background:var(--green);animation:blink 1s infinite}
.status-dot.off{background:var(--red)}
.status-dot.try{background:var(--gold);animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.status-text{font-size:.65rem;color:var(--text2);flex:1}
.reload-btn{font-size:.55rem;padding:2px 8px;border-radius:4px;background:var(--gold);color:#000;border:none;font-weight:700;cursor:pointer;flex-shrink:0}
.ctrl-btns{display:flex;gap:4px;padding:4px 8px;background:var(--bg2);flex-shrink:0}
.cbtn{flex:1;padding:6px;border:none;border-radius:6px;font-size:.7rem;font-weight:700;cursor:pointer;color:#fff}
.cbtn.start{background:linear-gradient(135deg,var(--green),#1a9c4a)}
.cbtn.stop{background:linear-gradient(135deg,var(--red),#c03030)}
.cbtn.snap{background:linear-gradient(135deg,var(--blue),#2a6ed4)}
.hand-section{padding:4px 8px;background:var(--bg2);flex-shrink:0}
.hand-label{font-size:.6rem;color:var(--text2);margin-bottom:2px;display:flex;justify-content:space-between}
.hand-row{display:flex;gap:2px;flex-wrap:wrap;min-height:28px;padding:2px;background:var(--bg);border-radius:4px}
.tile{width:24px;height:30px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile.wan{background:linear-gradient(180deg,#fff,#fde8e8)}.tile.tiao{background:linear-gradient(180deg,#fff,#e8fde8)}.tile.tong{background:linear-gradient(180deg,#fff,#e8e8fd)}
.tile .tn{font-size:10px;font-weight:800;line-height:1}.tile.wan .tn{color:var(--red)}.tile.tiao .tn{color:var(--green)}.tile.tong .tn{color:var(--blue)}
.tile .ts{font-size:6px;font-weight:600;line-height:1}.tile.wan .ts{color:var(--red)}.tile.tiao .ts{color:var(--green)}.tile.tong .ts{color:var(--blue)}
.tile.zi{background:linear-gradient(180deg,#fff,#f0f0f0)}.tile.zi .tn{color:var(--text)}.tile.zi .ts{color:var(--text2)}
.info-row{display:flex;gap:6px;padding:4px 8px;background:var(--bg2);flex-shrink:0;align-items:center;flex-wrap:wrap}
.chip{padding:2px 6px;border-radius:8px;font-size:.6rem;font-weight:600}
.chip.ok{background:rgba(46,189,94,.2);color:var(--green)}.chip.warn{background:rgba(240,160,48,.2);color:var(--gold)}
.chip.cnt{background:rgba(155,93,255,.2);color:var(--purple)}.chip.conf{background:rgba(74,142,255,.2);color:var(--blue)}
.chip.total{background:rgba(229,69,69,.2);color:var(--red)}
.model-error{padding:6px 8px;background:rgba(229,69,69,.15);border:1px solid rgba(229,69,69,.3);border-radius:6px;margin:4px 8px;font-size:.6rem;color:var(--red);flex-shrink:0;display:none}
.strategy{padding:6px 8px;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.best-card{background:var(--card);border-radius:8px;padding:10px;border:2px solid rgba(240,160,48,.4);margin-bottom:6px}
.best-label{font-size:.65rem;color:var(--gold);margin-bottom:4px;font-weight:600}
.best-tile{font-size:1.4rem;font-weight:800;text-align:center;padding:4px 0}
.best-reason{font-size:.65rem;color:var(--text2);text-align:center;margin-top:2px}
.shanten-info{display:flex;justify-content:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.shanten-chip{padding:3px 8px;border-radius:6px;font-size:.65rem;font-weight:700}
.shanten-chip.good{background:rgba(46,189,94,.15);color:var(--green)}.shanten-chip.mid{background:rgba(240,160,48,.15);color:var(--gold)}.shanten-chip.bad{background:rgba(229,69,69,.15);color:var(--red)}
.discard-section{padding:4px 8px;background:var(--bg2);flex-shrink:0}
.discard-title{font-size:.6rem;font-weight:700;color:var(--text2);margin-bottom:2px;display:flex;justify-content:space-between}
.discard-pool{display:flex;gap:2px;flex-wrap:wrap;min-height:18px;padding:2px;background:var(--bg);border-radius:3px}
.discard-tile{padding:1px 4px;border-radius:2px;font-size:.55rem;font-weight:700}
.discard-tile.wan{background:rgba(229,69,69,.2);color:var(--red)}.discard-tile.tiao{background:rgba(46,189,94,.2);color:var(--green)}.discard-tile.tong{background:rgba(74,142,255,.2);color:var(--blue)}
.discard-add{display:flex;gap:4px;margin-top:3px}
.discard-add select{flex:1;padding:2px;border-radius:3px;background:var(--card);color:var(--text);border:none;font-size:.6rem}
.discard-add button{padding:2px 10px;border-radius:3px;background:var(--gold);color:#000;border:none;font-size:.6rem;font-weight:700}
.debug{padding:2px 6px;background:#111;font-size:.5rem;color:#0f0;max-height:80px;overflow-y:auto;font-family:monospace;flex-shrink:0;white-space:pre-wrap;word-break:break-all;border-top:1px solid #333}
.debug-toggle{font-size:.55rem;color:var(--text2);padding:2px 8px;background:var(--bg2);cursor:pointer;flex-shrink:0;text-align:center}
.resize-hint{font-size:.5rem;color:var(--text2);padding:2px 8px;background:var(--bg2);text-align:center;flex-shrink:0}
</style>
</head>
<body>
<div class="app">
<div class="top-bar"><h1>🀄 v22.4 YOLO</h1></div>
<div class="status-row">
<div class="status-dot off" id="statusDot"></div>
<span class="status-text" id="statusText">未启动</span>
<button class="reload-btn" id="btnReload" onclick="reloadModel()" style="display:none">🔄重试</button>
</div>
<div class="model-error" id="modelError"></div>
<div class="ctrl-btns">
<button id="btnStart" class="cbtn start" onclick="startAuto()">▶ 启动</button>
<button id="btnStop" class="cbtn stop" onclick="stopAuto()" style="display:none">⏹ 停止</button>
<button class="cbtn snap" onclick="snapOnce()">📸 单次</button>
</div>
<div class="hand-section">
<div class="hand-label"><span>手牌</span><span id="handCount">0张</span></div>
<div class="hand-row" id="handRow"></div>
</div>
<div class="info-row">
<span class="chip ok" id="missChip">缺:无</span>
<span class="chip cnt" id="cntChip">牌:0</span>
<span class="chip conf" id="confChip">置信:-</span>
<span class="chip total" id="totalChip">检测:0</span>
</div>
<div class="strategy">
<div class="best-card">
<div class="best-label">🎯 推荐弃牌</div>
<div class="best-tile" id="bestTile">等待识别...</div>
<div class="best-reason" id="bestReason"></div>
<div class="shanten-info" id="shantenInfo"></div>
</div>
</div>
<div class="discard-section">
<div class="discard-title">弃牌池 <span id="clearDiscard" style="color:var(--red);cursor:pointer" onclick="clearDiscards()">清空</span></div>
<div class="discard-pool" id="discardPool"></div>
<div class="discard-add"><select id="addTileSel"></select><button onclick="addDiscard()">+添加</button></div>
</div>
<div class="resize-hint">◀ 拖左边缘调宽 | 拖底部调高 ▼</div>
<div class="debug-toggle" onclick="toggleDebug()">调试信息 ▶</div>
<div class="debug" id="debugPanel" style="display:none"></div>
</div>

<script>
var APP_URL='http://127.0.0.1:8666';
var TN=['一','二','三','四','五','六','七','八','九'];
var hand=new Array(27).fill(0);
var discards=new Array(27).fill(0);
var handSize=0;
var isAuto=false;
var autoTimer=null;
var debugVisible=false;
var modelLoadRetries=0;

function log(s){var p=document.getElementById('debugPanel');if(p)p.textContent+=s+'\n';if(p)p.scrollTop=p.scrollHeight}
function toggleDebug(){debugVisible=!debugVisible;document.getElementById('debugPanel').style.display=debugVisible?'block':'none';document.querySelector('.debug-toggle').textContent=debugVisible?'调试信息 ▼':'调试信息 ▶'}

function getSuit(i){return i<9?'wan':i<18?'tiao':'tong'}
function getSuitName(i){return i<9?'万':i<18?'条':'筒'}
function getSuitChar(i){return i<9?'m':i<18?'s':'p'}

function shortToIdx(s){
  if(!s||s.length<2)return -1;
  var num=parseInt(s[0]);
  var suit=s[1];
  if(isNaN(num)||num<1||num>9)return -1;
  if(suit==='m')return num-1;
  if(suit==='s')return 9+num-1;
  if(suit==='p')return 18+num-1;
  return -1;
}

// ============ 向听数计算器 ============
function calcShanten(h){
  var minShanten=8;
  for(var p=0;p<27;p++){
    if(h[p]<2)continue;
    h[p]-=2;
    var mentsu=0,taatsu=0;
    for(var s=0;s<3;s++){
      var tiles=[];
      for(var i=0;i<9;i++)tiles.push(h[s*9+i]);
      var r=analyzeSuit(tiles);
      mentsu+=r.mentsu;taatsu+=r.taatsu;
    }
    h[p]+=2;
    var sh=8-2*mentsu-Math.min(taatsu,4-mentsu);
    if(sh<minShanten)minShanten=sh;
  }
  {
    var mentsu2=0,taatsu2=0;
    for(var s=0;s<3;s++){
      var tiles=[];
      for(var i=0;i<9;i++)tiles.push(h[s*9+i]);
      var r=analyzeSuit(tiles);
      mentsu2+=r.mentsu;taatsu2+=r.taatsu;
    }
    var sh2=8-2*mentsu2-Math.min(taatsu2,4-mentsu2)+1;
    if(sh2<minShanten)minShanten=sh2;
  }
  return minShanten;
}

function analyzeSuit(t){
  var best={mentsu:0,taatsu:0};
  _dfsSuit(t,0,0,0,best);
  return best;
}

function _dfsSuit(t,pos,mentsu,taatsu,best){
  while(pos<9&&t[pos]===0)pos++;
  if(pos>=9){
    var total=mentsu+taatsu;
    if(total>best.mentsu+best.taatsu){best.mentsu=mentsu;best.taatsu=taatsu}
    else if(total===best.mentsu+best.taatsu&&mentsu>best.mentsu){best.mentsu=mentsu;best.taatsu=taatsu}
    return;
  }
  if(t[pos]>=3){t[pos]-=3;_dfsSuit(t,pos,mentsu+1,taatsu,best);t[pos]+=3}
  if(pos<=6&&t[pos]>=1&&t[pos+1]>=1&&t[pos+2]>=1){t[pos]--;t[pos+1]--;t[pos+2]--;_dfsSuit(t,pos,mentsu+1,taatsu,best);t[pos]++;t[pos+1]++;t[pos+2]++}
  if(t[pos]>=2){t[pos]-=2;_dfsSuit(t,pos,mentsu,taatsu+1,best);t[pos]+=2}
  if(pos<=7&&t[pos]>=1&&t[pos+1]>=1){t[pos]--;t[pos+1]--;_dfsSuit(t,pos,mentsu,taatsu+1,best);t[pos]++;t[pos+1]++}
  if(pos<=6&&t[pos]>=1&&t[pos+2]>=1){t[pos]--;t[pos+2]--;_dfsSuit(t,pos,mentsu,taatsu+1,best);t[pos]++;t[pos+2]++}
  if(t[pos]>0){var v=t[pos];t[pos]=0;_dfsSuit(t,pos,mentsu,taatsu,best);t[pos]=v}
}

function recommendDiscard(h,handSize){
  if(handSize<2)return{tile:'-',reason:'牌太少',shanten:8};
  var curShanten=calcShanten(h);
  var bestShanten=99,bestIdx=-1;
  var candidates=[];
  for(var i=0;i<27;i++){
    if(h[i]<=0)continue;
    h[i]--;
    var sh=calcShanten(h);
    h[i]++;
    candidates.push({idx:i,shanten:sh});
    if(sh<bestShanten){bestShanten=sh;bestIdx=i}
  }
  if(bestIdx<0)return{tile:'-',reason:'无牌可弃',shanten:curShanten};
  candidates.sort(function(a,b){return a.shanten-b.shanten});
  var best=candidates[0];
  var tileName=TN[best.idx%9]+getSuitName(best.idx);
  var reason='';
  if(best.shanten<curShanten)reason='向听数 -1 ✅';
  else if(best.shanten===curShanten)reason='向听数不变';
  else reason='向听数 +1 ⚠️';
  var sameSh=candidates.filter(function(c){return c.shanten===best.shanten});
  if(sameSh.length>1){
    var altNames=sameSh.slice(1,4).map(function(c){return TN[c.idx%9]+getSuitName(c.idx)}).join(' ');
    reason+=' | 也可弃:'+altNames;
  }
  return{tile:tileName,reason:reason,shanten:curShanten,bestShanten:best.shanten,candidates:candidates};
}

// ============ YOLO识别 ============
async function recognizeFromYOLO(){
  try{
    var r=await fetch(APP_URL+'/api/recognize?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(5000)});
    if(!r.ok){log('❌ /api/recognize HTTP '+r.status);return null}
    var data=await r.json();
    if(data.error){log('❌ 识别错误: '+data.error);return data} // 返回data以便显示debug
    return data;
  }catch(e){log('❌ 识别请求失败: '+e.message);return null}
}

function applyRecognition(data){
  if(!data)return;
  
  // 显示调试信息
  if(data.debug)log('🔍 '+data.debug);
  if(data.imgSize)log('📐 截图: '+data.imgSize+' 裁剪: -'+data.cropRight+'px');
  if(data.total!==undefined)document.getElementById('totalChip').textContent='检测:'+data.total;
  
  if(!data.tiles||data.tiles.length===0){
    log('⚠️ 未识别到手牌 (总检测:'+((data&&data.total)||0)+')');
    return;
  }
  
  hand=new Array(27).fill(0);
  var recognized=0;
  for(var i=0;i<data.tiles.length;i++){
    var t=data.tiles[i];
    var idx=shortToIdx(t.short);
    if(idx>=0){hand[idx]++;recognized++}
    else{log('🀄 字牌: '+t.name+' ('+t.short+')')}
  }
  handSize=recognized;
  
  updateHandUI();
  updateInfoUI(data);
  updateStrategy();
  log('✅ 识别到 '+data.tiles.length+' 张牌, 策略牌 '+recognized+' 张');
}

function updateHandUI(){
  var row=document.getElementById('handRow');row.innerHTML='';
  for(var i=0;i<27;i++){
    for(var c=0;c<hand[i];c++){
      var d=document.createElement('div');d.className='tile '+getSuit(i);
      d.innerHTML='<span class="tn">'+TN[i%9]+'</span><span class="ts">'+getSuitName(i)+'</span>';
      row.appendChild(d);
    }
  }
  document.getElementById('handCount').textContent=handSize+'张';
  document.getElementById('cntChip').textContent='牌:'+handSize;
  var missing=findMissing();
  var missChip=document.getElementById('missChip');
  missChip.textContent='缺:'+(missing||'无');
  missChip.className='chip '+(missing?'warn':'ok');
}

function updateInfoUI(data){
  var conf=data.avgConf?data.avgConf.toFixed(2):'-';
  document.getElementById('confChip').textContent='置信:'+conf;
}

function updateStrategy(){
  var rec=recommendDiscard(hand,handSize);
  var bestEl=document.getElementById('bestTile');
  var reasonEl=document.getElementById('bestReason');
  var shantenEl=document.getElementById('shantenInfo');
  
  bestEl.textContent=rec.tile;
  reasonEl.textContent=rec.reason;
  
  var shClass=rec.shanten<=1?'good':(rec.shanten<=3?'mid':'bad');
  var shLabel=rec.shanten===0?'听牌！':(rec.shanten+'向听');
  shantenEl.innerHTML='<span class="shanten-chip '+shClass+'">'+shLabel+'</span>';
}

function findMissing(){
  var hasW=false,hasT=false,hasO=false;
  for(var i=0;i<9;i++)if(hand[i]>0)hasW=true;
  for(var i=9;i<18;i++)if(hand[i]>0)hasT=true;
  for(var i=18;i<27;i++)if(hand[i]>0)hasO=true;
  var m=[];if(!hasW)m.push('万');if(!hasT)m.push('条');if(!hasO)m.push('筒');
  return m.join('');
}

function addDiscard(){var sel=document.getElementById('addTileSel').value;var idx=shortToIdx(sel);if(idx>=0){discards[idx]++;updateDiscardUI()}}
function clearDiscards(){discards=new Array(27).fill(0);updateDiscardUI()}
function updateDiscardUI(){
  var pool=document.getElementById('discardPool');pool.innerHTML='';
  for(var i=0;i<27;i++){for(var c=0;c<discards[i];c++){var d=document.createElement('div');d.className='discard-tile '+getSuit(i);d.textContent=TN[i%9]+getSuitName(i);pool.appendChild(d)}}
}
function populateAddSelect(){
  var sel=document.getElementById('addTileSel');
  for(var s=0;s<3;s++){var sn=['万','条','筒'][s];for(var n=0;n<9;n++){var opt=document.createElement('option');opt.value=TN[n]+['m','s','p'][s];opt.textContent=TN[n]+sn;sel.appendChild(opt)}}
}

// ============ 模型重试 ============
async function reloadModel(){
  document.getElementById('btnReload').style.display='none';
  document.getElementById('statusText').textContent='⏳ 重新加载模型...';
  document.getElementById('modelError').style.display='none';
  try{
    await fetch(APP_URL+'/api/reload',{cache:'no-store',signal:AbortSignal.timeout(3000)});
    log('🔄 已发送重新加载请求');
  }catch(e){log('❌ 重试失败: '+e.message)}
  setTimeout(checkModelStatus, 3000);
}

function showModelError(err){
  var el=document.getElementById('modelError');
  el.textContent='⚠️ 模型加载失败: '+err;
  el.style.display='block';
  document.getElementById('btnReload').style.display='';
}

function hideModelError(){
  document.getElementById('modelError').style.display='none';
  document.getElementById('btnReload').style.display='none';
}

async function checkModelStatus(){
  try{
    var r=await fetch(APP_URL+'/api/status',{cache:'no-store',signal:AbortSignal.timeout(3000)});
    if(r.ok){
      var i=await r.json();
      if(i.modelLoaded){
        hideModelError();
        document.getElementById('statusDot').className='status-dot try';
        document.getElementById('statusText').textContent='✅ 模型已加载'+(i.nnapi?' (NNAPI)':' (CPU)');
        return true;
      }else if(i.modelError && i.modelError !== ''){
        showModelError(i.modelError);
        return false;
      }
    }
  }catch(e){}
  return false;
}

// ============ 自动循环 ============
async function startAuto(){
  isAuto=true;
  document.getElementById('btnStart').style.display='none';
  document.getElementById('btnStop').style.display='';
  document.getElementById('statusDot').className='status-dot try';
  document.getElementById('statusText').textContent='连接中...';
  log('▶ v22.4 启动 YOLO识别 (letterbox+裁剪)');
  tryAutoConnect();
}

async function tryAutoConnect(){
  if(!isAuto)return;
  try{
    var r=await fetch(APP_URL+'/api/status',{cache:'no-store',signal:AbortSignal.timeout(3000)});
    if(r.ok){
      var i=await r.json();
      log('状态: model='+i.modelLoaded+' hasImg='+i.hasScreenshot+' nnapi='+i.nnapi+' panelW='+i.panelWidth);
      if(i.debug)log('🔍 '+i.debug);
      if(i.modelError && i.modelError !== '' && !i.modelLoaded){
        showModelError(i.modelError);
      }else{
        hideModelError();
      }
      if(i.modelLoaded&&i.hasScreenshot){
        document.getElementById('statusDot').className='status-dot on';
        document.getElementById('statusText').textContent='✅ YOLO已连接'+(i.nnapi?' (NNAPI)':' (CPU)');
        autoLoop();return;
      }
      if(!i.modelLoaded){
        document.getElementById('statusText').textContent='⏳ 模型加载中...';
        modelLoadRetries++;
        if(modelLoadRetries>=5){
          showModelError(i.modelError||'多次重试仍失败');
        }else{
          if(modelLoadRetries===2){
            fetch(APP_URL+'/api/reload',{cache:'no-store'}).catch(function(){});
          }
        }
      }
      else{document.getElementById('statusText').textContent='⏳ 等待截图...';}
      autoTimer=setTimeout(tryAutoConnect,2000);return;
    }
  }catch(e){log('❌ 连接失败: '+e.message)}
  document.getElementById('statusDot').className='status-dot off';
  document.getElementById('statusText').textContent='❌ 2秒后重试';
  autoTimer=setTimeout(tryAutoConnect,2000);
}

async function autoLoop(){
  if(!isAuto)return;
  try{
    var data=await recognizeFromYOLO();
    if(data){
      applyRecognition(data);
    }
  }catch(e){log('❌ 循环错误: '+e.message)}
  autoTimer=setTimeout(autoLoop,1500);
}

function stopAuto(){
  isAuto=false;
  modelLoadRetries=0;
  if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
  document.getElementById('btnStart').style.display='';
  document.getElementById('btnStop').style.display='none';
  document.getElementById('statusDot').className='status-dot off';
  document.getElementById('statusText').textContent='已停止';
}

function snapOnce(){
