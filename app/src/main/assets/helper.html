<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🀄 捉鸡麻将提示器 v12</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0e1a;--bg2:#131825;--card:#1c2333;--text:#e8edf5;--text2:#8b95a8;--red:#e54545;--green:#2ebd5e;--blue:#4a8eff;--gold:#f0a030;--purple:#9b5dff}
html,body{width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);font-size:13px}
.app{display:flex;flex-direction:column;height:100vh;width:100vw;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* 调试面板放最顶部，分屏也能看到 */
.debug{padding:4px 8px;background:#111;font-size:.55rem;color:#0f0;max-height:120px;overflow-y:auto;font-family:monospace;flex-shrink:0;white-space:pre-wrap;word-break:break-all;border-bottom:2px solid #333}
.debug:empty{display:none}

.top-bar{padding:6px 10px;background:linear-gradient(135deg,#5b21b6,#7c3aed);display:flex;justify-content:space-between;align-items:center;flex-shrink:0}
.top-bar h1{font-size:.75rem;font-weight:700}
.status-bar{display:flex;gap:4px;padding:4px 10px;background:var(--bg2);flex-wrap:wrap;flex-shrink:0}
.chip{padding:2px 6px;border-radius:10px;font-size:.6rem;font-weight:600}
.chip.early{background:var(--green);color:#000}.chip.mid{background:var(--gold);color:#000}.chip.late{background:var(--red);color:#fff}
.chip.cnt{background:var(--purple);color:#fff}.chip.rem{background:var(--card);color:var(--text)}

.auto-section{padding:6px 10px;background:var(--bg2);flex-shrink:0}
.auto-status{display:flex;align-items:center;gap:4px;margin-bottom:4px;font-size:.65rem}
.auto-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.auto-dot.on{background:var(--green);animation:blink 1s infinite}
.auto-dot.off{background:var(--red)}.auto-dot.try{background:var(--gold);animation:blink .5s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.auto-btns{display:flex;gap:4px}
.abtn{flex:1;padding:8px;border:none;border-radius:6px;font-size:.75rem;font-weight:700;cursor:pointer;color:#fff}
.abtn.start{background:linear-gradient(135deg,var(--green),#1a9c4a)}
.abtn.stop{background:linear-gradient(135deg,var(--red),#c03030)}
.abtn.snap{background:linear-gradient(135deg,var(--blue),#2a6ed4)}
.abtn:active{transform:scale(.97)}

/* 调试截图预览 - 小化 */
.preview{width:100%;height:50px;background:#000;border-radius:4px;overflow:hidden;margin-top:4px;position:relative}
.preview canvas{width:100%;height:100%;object-fit:contain;display:none}
.preview .no-src{display:flex;align-items:center;justify-content:center;height:100%;color:#555;font-size:.6rem}

/* 识别结果行 */
.ocr-row{display:flex;gap:2px;flex-wrap:wrap;padding:4px 10px;background:var(--bg2);min-height:24px;flex-shrink:0}
.ocr-chip{padding:2px 5px;border-radius:3px;font-size:.6rem;font-weight:700;color:#fff}
.ocr-chip.wan{background:var(--red)}.ocr-chip.tiao{background:var(--green)}.ocr-chip.tong{background:var(--blue)}.ocr-chip.unk{background:#555}

.hand-area{padding:6px 10px;background:var(--bg2);flex-shrink:0}
.hand-row{display:flex;gap:2px;flex-wrap:wrap;min-height:36px;padding:3px;background:var(--bg);border-radius:6px}
.tile{width:28px;height:38px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.tile.wan{background:linear-gradient(180deg,#fff,#fde8e8)}.tile.tiao{background:linear-gradient(180deg,#fff,#e8fde8)}.tile.tong{background:linear-gradient(180deg,#fff,#e8e8fd)}
.tile .tn{font-size:12px;font-weight:800;line-height:1}.tile.wan .tn{color:var(--red)}.tile.tiao .tn{color:var(--green)}.tile.tong .tn{color:var(--blue)}
.tile .ts{font-size:5px;opacity:.6;margin-top:1px}
.tile.sel{border:2px solid var(--gold);box-shadow:0 0 6px rgba(240,160,48,.5);transform:translateY(-2px)}
.op-row{display:flex;gap:4px;margin-top:4px}
.op-btn{flex:1;padding:8px;border:none;border-radius:6px;font-size:.75rem;font-weight:800;cursor:pointer;color:#fff}
.op-btn:active{transform:scale(.97)}
.op-btn.draw{background:linear-gradient(135deg,var(--green),#1a9c4a)}
.op-btn.discard{background:linear-gradient(135deg,var(--blue),#2a6ed4)}
.op-btn:disabled{opacity:.4;cursor:not-allowed}

.miss-bar{padding:3px 10px;font-size:.6rem;flex-shrink:0}
.miss-bar.ok{color:var(--green)}.miss-bar.warn{color:var(--gold)}

.strategy{padding:6px 10px;flex-shrink:0}
.tab-bar{display:flex;gap:3px;margin-bottom:6px;flex-shrink:0}
.tab-btn{flex:1;padding:5px;border:none;border-radius:4px;font-size:.6rem;font-weight:700;cursor:pointer;background:var(--card);color:var(--text2)}
.tab-btn.active{background:var(--gold);color:#000}
.tab-content{display:none}.tab-content.active{display:block}
.best-card{background:var(--card);border-radius:8px;padding:8px;margin-bottom:6px;border:1px solid rgba(240,160,48,.3)}
.best-label{font-size:.6rem;color:var(--gold);margin-bottom:2px}
.best-tile{font-size:1.2rem;font-weight:800;text-align:center;margin:2px 0}
.reasons{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.rtag{padding:1px 5px;border-radius:3px;font-size:.55rem;font-weight:600}
.rtag.good{background:rgba(46,189,94,.2);color:var(--green)}.rtag.bad{background:rgba(229,69,69,.2);color:var(--red)}.rtag.warn{background:rgba(224,168,32,.2);color:var(--gold)}.rtag.info{background:rgba(74,142,255,.2);color:var(--blue)}
.prob-row{display:flex;align-items:center;gap:4px;margin:2px 0}
.prob-name{width:30px;font-size:.6rem;font-weight:700;flex-shrink:0}
.prob-bar{flex:1;height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.prob-fill{height:100%;border-radius:7px;font-size:.5rem;font-weight:600;color:#fff;display:flex;align-items:center;justify-content:flex-end;padding-right:3px;min-width:20px}
.prob-fill.high{background:var(--green)}.prob-fill.mid{background:var(--gold)}.prob-fill.low{background:var(--red)}
.alt-item{display:flex;align-items:center;gap:4px;padding:3px 0;font-size:.6rem;border-bottom:1px solid rgba(255,255,255,.05)}
.def-item{display:inline-flex;align-items:center;gap:2px;padding:2px 6px;border-radius:4px;margin:1px;font-size:.6rem;font-weight:600}
.def-item.safe{background:rgba(46,189,94,.15);color:var(--green)}.def-item.mid{background:rgba(224,168,32,.15);color:var(--gold)}.def-item.danger{background:rgba(229,69,69,.15);color:var(--red)}
.rem-row{display:flex;align-items:center;gap:1px;margin:2px 0}
.rem-label{width:16px;font-size:.55rem;font-weight:700;flex-shrink:0}
.rem-cell{width:24px;height:24px;border-radius:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.5rem;font-weight:600;background:var(--card)}
.rem-cell.c0{background:rgba(229,69,69,.2)}.rem-cell.c1{background:rgba(224,168,32,.2)}.rem-cell.c2{background:rgba(74,142,255,.15)}
.rem-cell .rn{line-height:1}.rem-cell .rc{font-size:.45rem;color:var(--text2)}
.warn-box{background:rgba(229,69,69,.1);border:1px solid rgba(229,69,69,.3);border-radius:4px;padding:4px 6px;font-size:.6rem;color:var(--red);margin-top:4px}
.chicken-box{background:rgba(240,160,48,.1);border:1px solid rgba(240,160,48,.3);border-radius:4px;padding:4px 6px;font-size:.6rem;color:var(--gold);margin-top:4px}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:#fff;padding:6px 14px;border-radius:6px;font-size:.75rem;z-index:999;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<!-- 调试面板放最顶部，分屏也能看到 -->
<div id="debugPanel" class="debug" style="display:block"></div>

<div class="top-bar"><h1>🀄 捉鸡麻将提示器 v12</h1><div></div></div>
<div class="status-bar">
<span id="phaseBadge" class="chip early">前期</span>
<span id="tileCount" class="chip cnt">0张</span>
<span id="remainCount" class="chip rem">84张可摸</span>
</div>
<div class="auto-section">
<div class="auto-status">
<div id="autoDot" class="auto-dot off"></div>
<span id="autoText">未启动</span>
</div>
<div class="auto-btns">
<button id="btnStart" class="abtn start" onclick="startAuto()">▶ 启动</button>
<button id="btnStop" class="abtn stop" onclick="stopAuto()" style="display:none">⏹ 停止</button>
<button id="btnSnap" class="abtn snap" onclick="snapOnce()">📷 单次</button>
</div>
<div class="preview">
<canvas id="cvs"></canvas>
<div id="noSrc" class="no-src">等待截图...</div>
</div>
</div>
<div class="ocr-row" id="ocrRow"></div>
<div class="hand-area">
<div class="hand-row" id="handRow"></div>
<div class="op-row">
<button id="btnDiscard" class="op-btn discard" onclick="confirmDiscard()" disabled>出牌</button>
<button class="op-btn draw" onclick="newRound()">🔄 新局</button>
</div>
</div>
<div id="missBar" class="miss-bar"></div>
<div class="strategy">
<div class="tab-bar">
<button class="tab-btn active" onclick="switchTab('advice')">建议</button>
<button class="tab-btn" onclick="switchTab('ting')">听牌</button>
<button class="tab-btn" onclick="switchTab('defense')">防守</button>
<button class="tab-btn" onclick="switchTab('remain')">余牌</button>
</div>
<div id="tabAdvice" class="tab-content active"></div>
<div id="tabTing" class="tab-content"></div>
<div id="tabDefense" class="tab-content"></div>
<div id="tabRemain" class="tab-content"></div>
</div>
</div>
<div id="toast" class="toast"></div>

<script>
var APP_URL='http://127.0.0.1:8666';
var TN=['一','二','三','四','五','六','七','八','九'];
var hand=new Array(27).fill(0),selectedTile=-1;
var totalDiscarded=0,phase='early',thrownChick=false;
var isAuto=false,autoTimer=null,frameResults=[];
var debugLines=[];

function log(msg){
    var ts=new Date().toLocaleTimeString().substr(3,5);
    debugLines.push(ts+' '+msg);
    if(debugLines.length>30)debugLines.shift();
    var el=document.getElementById('debugPanel');
    el.style.display='block';
    el.innerHTML=debugLines.join('\n');
    el.scrollTop=el.scrollHeight;
}

async function startAuto(){
    isAuto=true;
    document.getElementById('btnStart').style.display='none';
    document.getElementById('btnStop').style.display='';
    document.getElementById('autoDot').className='auto-dot try';
    document.getElementById('autoText').textContent='连接中...';
    log('▶ 启动自动识别');
    tryAutoConnect();
}

async function tryAutoConnect(){
    if(!isAuto)return;
    try{
        var r=await fetch(APP_URL+'/api/status',{cache:'no-store',signal:AbortSignal.timeout(3000)});
        if(r.ok){
            document.getElementById('autoDot').className='auto-dot on';
            document.getElementById('autoText').textContent='✅ 截屏App已连接';
            showToast('✅ 已连接！');
            log('✅ 截屏App连接成功');
            autoLoop();
            return;
        }
    }catch(e){log('❌ 连接失败: '+e.message)}
    document.getElementById('autoDot').className='auto-dot off';
    document.getElementById('autoText').textContent='❌ 3秒后重试';
    autoTimer=setTimeout(tryAutoConnect,3000);
}

async function autoLoop(){
    if(!isAuto)return;
    try{
        var r=await fetch(APP_URL+'/api/screenshot?t='+Date.now(),{cache:'no-store',signal:AbortSignal.timeout(3000)});
        if(r.ok){
            var blob=await r.blob();
            if(blob.size<1000){log('⚠️ 截图太小: '+blob.size+'B');autoTimer=setTimeout(autoLoop,1500);return}
            var img=new Image();
            img.onload=function(){
                var c=document.getElementById('cvs');
                c.width=img.width;c.height=img.height;
                c.getContext('2d').drawImage(img,0,0);
                c.style.display='block';
                document.getElementById('noSrc').style.display='none';
                log('📸 截图: '+img.width+'x'+img.height+' ('+blob.size+'B)');
                var res=analyzeFrame(c);
                log('🎯 识别到 '+res.length+' 张牌: '+res.map(function(i){return getTileName(i)}).join(' '));
                if(res.length>0)applyOcrResult(res);
            };
            img.onerror=function(){log('❌ 图片加载失败')};
            img.src=URL.createObjectURL(blob);
        }else{
            log('❌ 请求失败: '+r.status);
        }
    }catch(e){log('❌ 错误: '+e.message)}
    autoTimer=setTimeout(autoLoop,1200);
}

function stopAuto(){
    isAuto=false;
    if(autoTimer){clearTimeout(autoTimer);autoTimer=null}
    document.getElementById('btnStart').style.display='';
    document.getElementById('btnStop').style.display='none';
    document.getElementById('autoDot').className='auto-dot off';
    document.getElementById('autoText').textContent='已停止';
}

function snapOnce(){if(!isAuto)startAuto()}

function analyzeFrame(canvas){
    var ctx=canvas.getContext('2d'),w=canvas.width,h=canvas.height;

    // 扩大搜索范围：y=80%-100%，覆盖分屏和全屏
    var handY1=Math.floor(h*0.80);
    var handY2=h;
    var handX1=Math.floor(w*0.02);
    var handX2=Math.floor(w*0.98);

    var imgData=ctx.getImageData(handX1,handY1,handX2-handX1,handY2-handY1);
    var hw=handX2-handX1,hh=handY2-handY1;
    var d=imgData.data;

    log('🔍 扫描区: '+hw+'x'+hh+' (y='+handY1+'-'+handY2+')');

    // Step 1: 逐行扫描找到手牌行的y位置
    // 手牌行特征：某几行有大量白色像素
    var rowBright=[];
    for(var y=0;y<hh;y++){
        var bright=0;
        for(var x=0;x<hw;x++){
            var i=(y*hw+x)*4;
            var r=d[i],g=d[i+1],b=d[i+2];
            if(r>160&&g>160&&b>140)bright++;  // 放宽白色阈值
        }
        rowBright.push(bright);
    }

    // 找到手牌行：白色像素密度最高的连续区域
    var maxRowBright=0,maxRowY=0;
    for(var y=0;y<hh;y++){
        if(rowBright[y]>maxRowBright){maxRowBright=rowBright[y];maxRowY=y}
    }
    
    // 手牌区域：白色像素密度>最大值30%的行
    var tileRowStart=-1,tileRowEnd=-1;
    var threshold=Math.max(hw*0.15,maxRowBright*0.3);
    for(var y=0;y<hh;y++){
        if(rowBright[y]>=threshold){
            if(tileRowStart===-1)tileRowStart=y;
            tileRowEnd=y;
        }
    }
    
    if(tileRowStart===-1){
        log('⚠️ 未找到手牌行 (maxBright='+maxRowBright+' at y='+maxRowY+')');
        // 尝试降级：用y=90%-100%
        tileRowStart=Math.floor(hh*0.85);
        tileRowEnd=hh;
        log('↩️ 降级扫描 y='+tileRowStart+'-'+tileRowEnd);
    }else{
        // 扩展上下各5px
        tileRowStart=Math.max(0,tileRowStart-5);
        tileRowEnd=Math.min(hh-1,tileRowEnd+5);
        log('📌 手牌行: y='+tileRowStart+'-'+tileRowEnd+' (最高白像素='+maxRowBright+' at y='+maxRowY+')');
    }

    var tileHH=tileRowEnd-tileRowStart+1;

    // Step 2: 在手牌行内逐列检测白色像素
    var colBright=[];
    for(var x=0;x<hw;x++){
        var bright=0;
        for(var y=tileRowStart;y<=tileRowEnd;y++){
            var i=(y*hw+x)*4;
            var r=d[i],g=d[i+1],b=d[i+2];
            if(r>160&&g>160&&b>140)bright++;
        }
        colBright.push(bright);
    }

    // 找牌区域：白色像素列宽度>8px
    var minColBright=Math.max(3,tileHH*0.15);
    var inTile=false,tileStart=0,tileRegions=[];
    for(var x=0;x<hw;x++){
        if(colBright[x]>minColBright&&!inTile){
            inTile=true;tileStart=x;
        }else if(colBright[x]<=minColBright&&inTile){
            inTile=false;
            if(x-tileStart>6)tileRegions.push({x1:tileStart,x2:x,w:x-tileStart});
        }
    }
    if(inTile&&hw-tileStart>6)tileRegions.push({x1:tileStart,x2:hw,w:hw-tileStart});

    log('🀄 检测到 '+tileRegions.length+' 个牌区域');

    if(tileRegions.length===0){
        // 输出前几列的白色像素数帮助诊断
        var sample='';
        for(var x=0;x<Math.min(50,hw);x++)sample+=colBright[x]+(x%10===9?'|':' ');
        log('📊 列白色采样: '+sample);
        return[];
    }

    // Step 3: 合并相邻小区域、拆分过大区域
    var avgW=tileRegions.reduce(function(s,t){return s+t.w},0)/tileRegions.length;
    log('📏 平均牌宽: '+Math.round(avgW)+'px');
    var tiles=[];
    for(var i=0;i<tileRegions.length;i++){
        var t=tileRegions[i];
        if(t.w>avgW*1.8&&tileRegions.length<14){
            var numSplit=Math.round(t.w/avgW);
            var splitW=t.w/numSplit;
            for(var s=0;s<numSplit;s++){
                var sx1=Math.round(t.x1+s*splitW);
                var sx2=Math.round(t.x1+(s+1)*splitW);
                tiles.push({x1:sx1,x2:sx2,w:sx2-sx1});
            }
        }else{
            tiles.push(t);
        }
    }

    // Step 4: 对每个牌区域分析颜色
    var results=[];
    for(var i=0;i<tiles.length;i++){
        var t=tiles[i];
        var redPx=0,greenPx=0,bluePx=0,yellowPx=0,whitePx=0,totalPx=0;
        
        for(var x=t.x1;x<t.x2;x++){
            for(var y=tileRowStart;y<=tileRowEnd;y++){
                var idx=(y*hw+x)*4;
                var r=d[idx],g=d[idx+1],b=d[idx+2];
                totalPx++;
                // 白色/奶白色背景
                if(r>160&&g>160&&b>140){whitePx++;continue}
                // 万字(红色系): R高, G和B低
                if(r>80&&g<100&&b<100){redPx++;continue}
                // 条子(绿色系): G高, R和B低
                if(g>80&&r<100&&b<100){greenPx++;continue}
                // 筒子(蓝色/青色/紫色): B高, 或B+R混合但G低
                if(b>70||(r>70&&b>70&&g<80)){bluePx++;continue}
                // 其他暗色/杂色忽略
            }
        }

        var colored=redPx+greenPx+bluePx;
        var whiteRatio=whitePx/Math.max(1,totalPx);
        
        if(colored<3&&whiteRatio<0.15){
            log('  牌'+i+': w='+t.w+' 跳过(白'+whitePx+' 有色'+colored+')');
            continue;
        }

        var suit,suitIdx;
        // 按有色像素数判断花色
        if(redPx>=greenPx&&redPx>=bluePx&&redPx>=2){
            suit='万';suitIdx=0;
        }else if(greenPx>=redPx&&greenPx>=bluePx&&greenPx>=2){
            suit='条';suitIdx=9;
        }else if(bluePx>=2){
            suit='筒';suitIdx=18;
        }else if(colored<3){
            // 有色像素太少，可能是牌背或空白
            log('  牌'+i+': w='+t.w+' 有色太少('+colored+') 跳过');
            continue;
        }else{
            suit='?';suitIdx=-1;
        }

        // 数字识别：基于有色像素总量估算
        var num=1;
        if(suitIdx>=0){
            var total=redPx+greenPx+bluePx;
            var tileArea=(t.x2-t.x1)*tileHH;
            var density=total/Math.max(1,tileArea);
            
            // 基于密度和总量的粗略映射
            // 需要根据实际数据校准
            if(total<15)num=1;
            else if(total<30)num=2;
            else if(total<45)num=3;
            else if(total<60)num=4;
            else if(total<80)num=5;
            else if(total<100)num=6;
            else if(total<125)num=7;
            else if(total<155)num=8;
            else num=9;
        }

        var idx=suitIdx+(num-1);
        if(idx>=0&&idx<27){
            results.push(idx);
            log('  牌'+i+': x='+t.x1+'-'+t.x2+' w='+t.w+' R='+redPx+' G='+greenPx+' B='+bluePx+' 白='+whitePx+' → '+TN[num-1]+suit);
        }else{
            log('  牌'+i+': w='+t.w+' R='+redPx+' G='+greenPx+' B='+bluePx+' → 未知');
        }
    }

    // 多帧投票
    frameResults.push(results);
    if(frameResults.length>5)frameResults.shift();
    return voteResults(frameResults);
}

function voteResults(frames){
    if(!frames.length)return[];
    var counts={};
    frames.forEach(function(f){f.forEach(function(idx){counts[idx]=(counts[idx]||0)+1})});
    var result=[];
    for(var k in counts){
        if(counts[k]>=Math.max(2,frames.length-1)){
            result.push(parseInt(k));
        }
    }
    return result.sort(function(a,b){return a-b});
}

function applyOcrResult(tiles){
    hand=new Array(27).fill(0);
    tiles.forEach(function(idx){hand[idx]++});
    selectedTile=-1;
    document.getElementById('btnDiscard').disabled=true;
    updateDisplay();
    // 更新OCR显示行
    var html='';
    tiles.forEach(function(idx){
        var cls=idx<9?'wan':idx<18?'tiao':'tong';
        html+='<span class="ocr-chip '+cls+'">'+getTileName(idx)+'</span>';
    });
    document.getElementById('ocrRow').innerHTML=html;
}

function updateDisplay(){updateHandDisplay();updateStats();updateMissing();updateAllPanels()}

function updateHandDisplay(){
    var html='',hasHand=false;
    for(var i=0;i<27;i++){
        if(!hand[i])continue;
        hasHand=true;
        var suit=i<9?'wan':i<18?'tiao':'tong';
        var sn=i<9?'万':i<18?'条':'筒';
        for(var j=0;j<hand[i];j++){
            var sel=selectedTile===i?'sel':'';
            html+='<div class="tile '+suit+' '+sel+'" onclick="selectTile('+i+')"><span class="tn">'+TN[i%9]+'</span><span class="ts">'+sn+'</span></div>';
        }
    }
    document.getElementById('handRow').innerHTML=html||'<span style="color:#555;font-size:.65rem">等待识别...</span>';
}

function updateStats(){
    var total=0;hand.forEach(function(c){total+=c});
    document.getElementById('tileCount').textContent=total+'张';
    document.getElementById('remainCount').textContent=(84-totalDiscarded)+'张可摸';
    var pb=document.getElementById('phaseBadge');
    if(totalDiscarded<=12){phase='early';pb.textContent='前期';pb.className='chip early'}
    else if(totalDiscarded<=36){phase='mid';pb.textContent='中期';pb.className='chip mid'}
    else{phase='late';pb.textContent='后期';pb.className='chip late'}
}

function updateMissing(){
    var el=document.getElementById('missBar'),total=0;hand.forEach(function(c){total+=c});
    if(!total){el.textContent='';return}
    var hasW=false,hasT=false,hasB=false;
    for(var i=0;i<9;i++)if(hand[i])hasW=true;
    for(var i=9;i<18;i++)if(hand[i])hasT=true;
    for(var i=18;i<27;i++)if(hand[i])hasB=true;
    var miss=(!hasW?1:0)+(!hasT?1:0)+(!hasB?1:0);
    if(miss>=1){el.className='miss-bar ok';el.textContent='✅ 已缺门'}
    else{el.className='miss-bar warn';el.textContent='⚠️ 需缺1门'}
}

function selectTile(idx){
    if(selectedTile===idx){confirmDiscard()}
    else{selectedTile=idx;document.getElementById('btnDiscard').disabled=false;updateHandDisplay()}
}

function confirmDiscard(){
    if(selectedTile<0)return;
    hand[selectedTile]--;
    totalDiscarded++;
    selectedTile=-1;
    document.getElementById('btnDiscard').disabled=true;
    updateDisplay();
}

function newRound(){
    hand=new Array(27).fill(0);selectedTile=-1;totalDiscarded=0;thrownChick=false;frameResults=[];
    debugLines=[];
    document.getElementById('btnDiscard').disabled=true;
    document.getElementById('ocrRow').innerHTML='';
    document.getElementById('debugPanel').innerHTML='';
    updateDisplay();
    showToast('🔄 新一局');
}

function switchTab(name){
    document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});
    document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});
    var names=['advice','ting','defense','remain'];
    var btns=document.querySelectorAll('.tab-btn');
    for(var i=0;i<names.length;i++){if(names[i]===name){btns[i].classList.add('active');break}}
    var el=document.getElementById('tab'+name.charAt(0).toUpperCase()+name.slice(1));
    if(el)el.classList.add('active');updateAllPanels();
}

function updateAllPanels(){updateAdvice();updateTing();updateDefense();updateRemain()}

function updateAdvice(){
    var el=document.getElementById('tabAdvice'),total=0;hand.forEach(function(c){total+=c});
    if(!total){el.innerHTML='<span style="color:#555">等待识别手牌...</span>';return}
    var xt=calcXT(hand);
    if(xt===-1){el.innerHTML='<div style="text-align:center;padding:10px"><div style="font-size:1.5rem">🎉</div><div style="color:var(--gold);font-size:1rem;font-weight:800">可以胡牌！</div></div>';return}
    var sugs=genSugs();
    if(!sugs.length){el.innerHTML='<span style="color:#555">无法生成建议</span>';return}
    var best=sugs[0];
    var html='<div class="best-card"><div class="best-label">🎯 最佳出牌</div>';
    html+='<div class="best-tile" style="color:'+tileColor(best.idx)+'">'+getTileName(best.idx)+'</div>';
    html+='<div class="reasons">';
    html+='<span class="rtag good">进张'+best.jz+'张</span>';
    html+='<span class="rtag info">向听'+best.xt+'</span>';
    if(best.idx===0||best.idx===9||best.idx===18)html+='<span class="rtag warn">🐔鸡牌</span>';
    if(best.safety>=70)html+='<span class="rtag good">🟢安全</span>';
    else if(best.safety<40)html+='<span class="rtag bad">🔴危险</span>';
    html+='</div></div>';
    if(sugs.length>1){
        html+='<div style="margin-top:4px">';
        sugs.slice(0,5).forEach(function(s){
            var pct=Math.round(s.jz/Math.max(1,best.jz)*100),cls=pct>=70?'high':pct>=40?'mid':'low';
            html+='<div class="prob-row"><span class="prob-name" style="color:'+tileColor(s.idx)+'">'+getTileName(s.idx)+'</span>';
            html+='<div class="prob-bar"><div class="prob-fill '+cls+'" style="width:'+pct+'%">'+s.jz+'张</div></div></div>';
        });
        html+='</div>';
    }
    el.innerHTML=html;
}

function genSugs(){
    var total=0;hand.forEach(function(c){total+=c});if(!total)return[];
    var sugs=[];
    for(var i=0;i<27;i++){
        if(!hand[i])continue;
        hand[i]--;var newXT=calcXT(hand),newJZ=countJZ(hand,newXT);hand[i]++;
        var safety=calcSafety(i);
        var chickenVal=(i===0||i===9||i===18)?2.5:0;
        var score=(10-newXT)*3+newJZ*.8+safety*.15+chickenVal*.5;
        if((i===0||i===9||i===18)&&phase==='early')score-=1;
        sugs.push({idx:i,xt:newXT,jz:newJZ,safety:safety,score:score});
    }
    sugs.sort(function(a,b){return b.score-a.score});return sugs;
}

function calcSafety(idx){
    var safety=50,num=idx%9,remain=getRem(idx);
    safety+=remain*5;if(num===0||num===8)safety+=10;if(num===0)safety+=5;
    if(phase==='late'){if(remain>=3&&num>=2&&num<=6)safety-=15}
    else if(phase==='early')safety+=5;
    return Math.max(0,Math.min(100,safety));
}

function updateTing(){
    var el=document.getElementById('tabTing'),xt=calcXT(hand);
    if(xt!==0){el.innerHTML='<span style="color:#555">当前向听数: '+xt+'，听牌后显示</span>';return}
    var list=findTing(hand);
    if(!list.length){el.innerHTML='<span style="color:#555">无听牌</span>';return}
    var html='<div style="font-size:.75rem;font-weight:800;color:var(--gold);margin-bottom:4px">🎯 听牌！</div>';
    list.sort(function(a,b){return getRem(b)-getRem(a)});
    list.forEach(function(t){
        var rem=getRem(t),cls=rem>=5?'high':rem>=3?'mid':'low';
        html+='<div class="prob-row"><span class="prob-name" style="color:'+tileColor(t)+'">'+getTileName(t)+'</span>';
        html+='<div class="prob-bar"><div class="prob-fill '+cls+'" style="width:'+Math.max(10,rem*20)+'%">'+rem+'张</div></div></div>';
    });
    el.innerHTML=html;
}

function updateDefense(){
    var el=document.getElementById('tabDefense');
    if(phase!=='late'&&phase!=='mid'){el.innerHTML='<span style="color:#555;font-size:.65rem">中后期激活</span>';return}
    var items=[];
    for(var i=0;i<27;i++){if(hand[i])items.push({idx:i,safety:calcSafety(i)})}
    items.sort(function(a,b){return b.safety-a.safety});
    var html='';
    items.slice(0,12).forEach(function(t){
        var cls=t.safety>=70?'safe':t.safety>=40?'mid':'danger';
        var sn=t.idx<9?'万':t.idx<18?'条':'筒';
        html+='<div class="def-item '+cls+'">'+TN[t.idx%9]+sn+' <span style="font-size:.5rem">'+t.safety+'</span></div>';
    });
    el.innerHTML=html||'<span style="color:#555">无手牌</span>';
}

function updateRemain(){
    var el=document.getElementById('tabRemain'),html='';
    [['万',0,9,'red'],['条',9,18,'green'],['筒',18,27,'blue']].forEach(function(c){
        html+='<div class="rem-row"><span class="rem-label" style="color:var(--'+c[3]+')">'+c[0]+'</span>';
        for(var i=c[1];i<c[2];i++){
            var rem=getRem(i),cc=rem===0?'c0':rem===1?'c1':rem===2?'c2':'';
            html+='<div class="rem-cell '+c[3]+cc+'"><span class="rn" style="color:var(--'+c[3]+')">'+TN[i%9]+'</span><span class="rc">'+rem+'</span></div>';
        }
        html+='</div>';
    });
    el.innerHTML=html;
}

function getTileName(idx){return TN[idx%9]+(idx<9?'万':idx<18?'条':'筒')}
function tileColor(idx){return idx<9?'var(--red)':idx<18?'var(--green)':'var(--blue)'}
function getRem(idx){var c=4-hand[idx];return Math.max(0,c)}

function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show')},1500)}

// 向听数计算
function calcXT(tiles){
    var pairs=0;for(var i=0;i<27;i++)pairs+=Math.floor(tiles[i]/2);
    var qdXT=6-pairs;if(qdXT<0)qdXT=10;
    var bestM=0,bestT=0;
    function analyze(arr,idx,m,t,head,depth){
        if(depth>100)return;
        while(idx<27&&!arr[idx])idx++;
        if(idx>=27){if(m+Math.floor((13-m*3-t)/2)>=4||(m===4&&t===0)){if(m>bestM||(m===bestM&&t>bestT)){bestM=m;bestT=t}}return}
        if(t>4-m)return;
        var si=idx%9,ss=si<=6;
        if(arr[idx]>=3){arr[idx]-=3;analyze(arr,idx,m+1,t,head,depth+1);arr[idx]+=3}
        if(ss&&arr[idx]>=1&&arr[idx+1]>=1&&arr[idx+2]>=1){arr[idx]--;arr[idx+1]--;arr[idx+2]--;analyze(arr,idx,m+1,t,head,depth+1);arr[idx]++;arr[idx+1]++;arr[idx+2]++}
        if(arr[idx]>=2&&!head){arr[idx]-=2;analyze(arr,idx,m,t,true,depth+1);arr[idx]+=2}
        if(ss&&arr[idx]>=1&&arr[idx+1]>=1&&t<4-m){arr[idx]--;arr[idx+1]--;analyze(arr,idx,m,t+1,head,depth+1);arr[idx]++;arr[idx+1]++}
        if(ss&&arr[idx]>=1&&arr[idx+2]>=1&&t<4-m){arr[idx]--;arr[idx+2]--;analyze(arr,idx,m,t+1,head,depth+1);arr[idx]++;arr[idx+2]++}
        var sv=arr[idx];arr[idx]=0;analyze(arr,idx,m,t,head,depth+1);arr[idx]=sv;
    }
    analyze(tiles.slice(),0,0,0,false,0);
    var nXT=8-2*bestM-bestT;
    return Math.min(qdXT,nXT);
}
function findTing(tiles){
    var list=[];
    for(var i=0;i<27;i++){if(tiles[i]>=4)continue;var test=tiles.slice();test[i]++;if(calcXT(test)===-1)list.push(i)}
    return list;
}
function countJZ(tiles,curXT){
    var count=0;
    for(var i=0;i<27;i++){if(tiles[i]>=4)continue;var test=tiles.slice();test[i]++;if(calcXT(test)<curXT)count+=getRem(i)}
    return count;
}
